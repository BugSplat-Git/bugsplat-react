name: CI

on:
  pull_request:
    branches:
      - main

env:
  BUGSPLAT_DATABASE: bugsplat_react
  BUGSPLAT_CLIENT_ID: b8fbe5e4e915ddc9838cf186df1fe636
  BUGSPLAT_CLIENT_SECRET: w4UHnUa104bnbQEfQ8gnxhRTshHaVss5

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
        react-version: [18, 19]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node v${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Use React ${{ matrix.react-version }}
        if: matrix.react-version != 19
        run: >
          npm i --no-save
          react@${{ matrix.react-version }}
          react-dom@${{ matrix.react-version }}
          @types/react@${{ matrix.react-version }}
          @types/react-dom@${{ matrix.react-version }}

      - name: Build
        run: npm run build

      - name: Run Test Suite
        run: npm run test:all
